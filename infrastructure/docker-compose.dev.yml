services:
  studio-postgres:
    image: postgres:16-alpine
    container_name: studio-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5434:5432'
    environment:
      POSTGRES_USER: studioemar
      POSTGRES_PASSWORD: studioemar
      POSTGRES_DB: studioemar
    volumes:
      - studio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studioemar -d studioemar']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studio_postgres_data:
