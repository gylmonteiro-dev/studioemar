<body class="bg-background min-h-screen text-on-background font-body-md antialiased selection:bg-surface-variant selection:text-primary">
<!-- 
        Navigation Shell Suppressed: 
        As per the instructions, this is a transactional/task-focused screen (Cancellation Warning).
        Therefore, the TopAppBar and BottomNavBar are completely suppressed to focus the user's attention on the critical decision.
    -->
<main class="min-h-screen flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop">
<!-- Centered Focused Card -->
<div class="w-full max-w-[440px] bg-surface border border-outline-variant/10 rounded-xl p-stack-lg flex flex-col items-center animate-fade-in-up">
<!-- Warning Icon -->
<div class="w-16 h-16 rounded-full bg-error-container flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-[32px] text-error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    warning
                </span>
</div>
<!-- Title -->
<h1 class="font-headline-md text-headline-md md:font-headline-lg md:text-headline-lg text-primary text-center mb-stack-sm tracking-tighter">
                ATENÇÃO
            </h1>
<!-- Message -->
<p class="font-body-md text-body-md text-secondary text-center mb-stack-lg max-w-[320px]">
                O prazo para cancelamento com direito à reposição terminou. Você pode cancelar sua participação, porém não receberá crédito de reposição.
            </p>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-stack-sm">
<!-- Primary Action (Manter treino - Vibrant Orange) -->
<button class="w-full py-4 rounded-lg font-button text-button text-on-primary cta-gradient flex justify-center items-center transition-transform active:scale-95 shadow-sm">
                    Manter treino
                </button>
<!-- Secondary Action (Cancelar mesmo assim - Outline/Discreet) -->
<button class="w-full py-4 rounded-lg font-button text-button border border-outline text-primary bg-transparent flex justify-center items-center transition-colors hover:bg-surface-variant active:scale-95">
                    Cancelar mesmo assim
                </button>
</div>
</div>
</main>
<style>
        /* Simple entry animation for the modal */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
